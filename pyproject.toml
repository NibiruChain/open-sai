[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-anything-sai"
version = "0.1.0"
description = "Command-line access to Sai trading and market data"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["click>=8.1", "cryptography>=44", "httpx>=0.28", "prompt-toolkit>=3", "websockets>=14"]

[project.scripts]
cli-anything-sai = "cli_anything.sai.sai_cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "ty>=0.0.1a6"]

[tool.setuptools.packages.find]
where = ["agent-harness"]
namespaces = true
include = ["cli_anything.*"]

[tool.setuptools.package-data]
"cli_anything.sai" = ["skills/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["agent-harness/cli_anything/sai/tests"]

[tool.ruff]
target-version = "py311"
exclude = ["agent-harness/cli_anything/sai/utils/repl_skin.py"]

[tool.ty.environment]
extra-paths = ["agent-harness"]
