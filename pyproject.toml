[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sai-cli"
version = "0.1.0"
description = "Command-line access to Sai trading and market data"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "click>=8.1",
    "cryptography>=44",
    "httpx>=0.28",
    "mcp>=1.22,<2",
    "prompt-toolkit>=3",
    "tomlkit>=0.15.2",
    "websockets>=14",
]

[project.scripts]
sai = "sai_cli.sai_cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "ty>=0.0.1a6"]

[tool.setuptools.packages.find]
where = ["cli"]
namespaces = true
include = ["sai_cli*"]

[tool.setuptools.package-data]
# cli/sai_cli/skills is a symlink to skills/sai, the whole agent skill.
"sai_cli" = ["skills/.source.json", "skills/*.md", "skills/*/*.md"]

[tool.pytest.ini_options]
testpaths = ["cli/sai_cli/tests"]

[tool.ruff]
target-version = "py311"
exclude = ["cli/sai_cli/utils/repl_skin.py"]

[tool.ty.environment]
extra-paths = ["cli", "scripts"]
