name: "Release"

# `just release X.Y.Z --run` pushes the tag that starts this workflow.
on:
  push:
    tags: ["sai-cli/v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Create the GitHub Release and upload its files.
      contents: write
    env:
      # The tag contains a slash (sai-cli/vX.Y.Z); every step quotes it.
      TAG: ${{ github.ref_name }}
    steps:
      # Full history so the tag can be checked against origin/main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check that the tag is on main
        run: git merge-base --is-ancestor "$TAG^{commit}" origin/main

      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"

      - name: Check that the tag matches pyproject.toml
        run: uv run --no-project python scripts/check_release.py "$TAG"

      - name: Install dependencies from uv.lock
        run: uv sync --locked --all-groups

      - run: uv run pytest

      # Same command as "just build-check".
      - name: Check that the wheel and sdist ship SKILL.md
        run: uv run python scripts/check_dist.py

      - name: Build the wheel and sdist
        run: uv build --out-dir dist

      - name: Write SHA256SUMS
        run: (cd dist && sha256sum -- *) > SHA256SUMS

      # `gh release create --verify-tag` only checks that the tag exists. A
      # tag moved after checkout must not get this build's files.
      - name: Check that the remote tag is still the built commit
        run: |
          uv run --no-project python scripts/check_release.py "$TAG" \
            --built "$(git rev-parse HEAD)" \
            --remote "https://github.com/$GITHUB_REPOSITORY"

      # A version with a hyphen, such as sai-cli/v0.2.0-rc.1, is a pre-release.
      # `sai update` picks the highest sai-cli/v* release that is not one, and
      # does not use GitHub's single "latest" release.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#sai-cli/}"
          flags=()
          if [[ "$version" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "sai-cli $version" --generate-notes "${flags[@]}" \
            dist/* SHA256SUMS
